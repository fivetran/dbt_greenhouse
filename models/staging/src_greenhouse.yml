version: 2

sources:
  - name: greenhouse
    database: "{% if target.type != 'spark' %}{{ var('greenhouse_database', target.database)}}{% endif %}"
    schema: "{{ var ('greenhouse_schema', 'greenhouse') }}"

    loader: fivetran

    config:
      loaded_at_field: _fivetran_synced
      freshness:
        warn_after: {count: 72, period: hour}
        error_after: {count: 96, period: hour}
      enabled: "{{ var('greenhouse_sources', []) == [] }}"

    tables:
      - name: note
        identifier: "{{ var('greenhouse_note_identifier', 'note')}}"
        description: Table capturing notes, logged emails, interview feedback, and other activity entries on a candidate's profile.
        config:
          enabled: "{{ var('greenhouse_using_note', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the note record has been soft-deleted from Greenhouse.
          - name: id
            description: Unique ID of the note.
          - name: user_id
            description: Foreign key referencing the USER who authored the note. Null for system-generated notes.
          - name: candidate_id
            description: Foreign key referencing the CANDIDATE this note is attached to.
          - name: application_id
            description: Foreign key referencing the APPLICATION this note is attached to, if any.
          - name: body
            description: Content of the note.
          - name: body_with_tags
            description: Content of the note with @-mentions preserved as tags.
          - name: created_at
            description: Timestamp the record was created.
          - name: email_attachment_file_names
            description: File names of attachments on a logged email.
          - name: email_from
            description: From address on a logged email.
          - name: email_to
            description: To address on a logged email.
          - name: import_hash
            description: De-duplication key set when the note was created by a bulk import.
          - name: subject
            description: Subject line of the note, populated for email-type notes.
          - name: type
            description: Type of note (e.g. note, email, activity, interview feedback).
          - name: updated_at
            description: Timestamp the record was last updated.
          - name: visibility
            description: Who can see the note (e.g. public, private, admin only).

      - name: application
        identifier: "{{ var('greenhouse_application_identifier', 'application')}}"
        description: Table capturing all applications (candidates + prospects).
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the application has been soft-deleted from Greenhouse.
          - name: id
            description: Unique identifier for the application.
          - name: candidate_id
            description: Foreign key referencing the CANDIDATE who submitted the application.
          - name: last_activity_at
            description: Timestamp of the most recent activity on this application.
          - name: location_address
            description: Free-form location string captured on the application.
          - name: prospect
            description: True for prospect applications; false for candidate applications on a specific job.
          - name: rejected_at
            description: Timestamp the application was rejected. Null if not rejected.
          - name: source_id
            description: Foreign key referencing the SOURCE of the application.
          - name: status
            description: Lifecycle status of the application (`active`, `rejected`, `hired`, `converted`).
          - name: stage_id
            description: Foreign key referencing the current JOB_INTERVIEW_STAGE.
          - name: coordinator_id
            description: Foreign key referencing the USER assigned as coordinator.
          - name: job_id
            description: Foreign key referencing the JOB this application is on.
          - name: job_post_id
            description: Foreign key referencing the JOB_POST the candidate applied through.
          - name: recruiter_id
            description: Foreign key referencing the USER assigned as recruiter.
          - name: referrer_id
            description: Foreign key referencing the REFERRER who credited this application.
          - name: agency_note_id
            description: Foreign key referencing the NOTE created when a candidate was submitted by an agency.
          - name: needs_decision
            description: True when the application is waiting on a hiring-team decision in its current stage.
          - name: created_at
            description: Timestamp the application record was created.
          - name: updated_at
            description: Timestamp the application record was last updated.

      - name: application_history
        identifier: "{{ var('greenhouse_application_history_identifier', 'application_history')}}"
        description: Table capturing the history of applications as they advance through job stages.
        config:
          enabled: "{{ var('greenhouse_using_app_history', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the application history record has been soft-deleted from Greenhouse.
          - name: application_id
            description: Foreign key referencing the APPLICATION that was updated.
          - name: new_stage_id
            description: Foreign key referencing the JOB_STAGE that the application was advanced to.
          - name: new_status
            description: Status of the application as of this update.
          - name: updated_at
            description: Timestamp of when the application was advanced.

      - name: application_stage
        identifier: "{{ var('greenhouse_application_stage_identifier', 'application_stage')}}"
        description: Table capturing each stage an application has occupied, one row per stage per application.
        config:
          enabled: "{{ var('greenhouse_using_application_stage', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the application stage record has been soft-deleted from Greenhouse.
          - name: id
            description: Unique ID of the application stage record.
          - name: application_id
            description: Foreign key referencing the APPLICATION this stage entry belongs to.
          - name: job_interview_stage_id
            description: Foreign key referencing the JOB_INTERVIEW_STAGE occupied during this entry.
          - name: entered_at
            description: Timestamp the application entered this stage. Null only for backfilled or partially recorded history.
          - name: exited_at
            description: Timestamp the application left this stage. Null while the application is still in this stage (the current stage entry).
          - name: days_in_stage
            description: Whole number of calendar days the application has spent in this stage, computed by Greenhouse as of the last sync.
          - name: current
            description: Boolean that is true when this row represents the application's current interview stage.
          - name: created_at
            description: Timestamp the application stage record was created.
          - name: updated_at
            description: Timestamp the application stage record was last updated.

      - name: attachment
        identifier: "{{ var('greenhouse_attachment_identifier', 'attachment')}}"
        description: Table capturing files attached to the candidate profile.
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the attachment has been soft-deleted from Greenhouse.
          - name: id
            description: Unique identifier for the attachment.
          - name: candidate_id
            description: Foreign key referencing the CANDIDATE who uploaded the attachment.
          - name: application_id
            description: Foreign key referencing the APPLICATION this attachment is associated with.
          - name: filename
            description: Name of the file.
          - name: type
            description: One of ["resume", "cover_letter", "admin_only"].
          - name: url
            description: URL of where the attachment is stored.
          - name: created_at
            description: Timestamp the attachment was created.
          - name: updated_at
            description: Timestamp the attachment was last updated.

      - name: candidate
        identifier: "{{ var('greenhouse_candidate_identifier', 'candidate')}}"
        description: Table capturing an organization's candidates.
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the candidate is soft-deleted.
          - name: id
            description: Unique identifier for the candidate.
          - name: company
            description: Current company the candidate works at.
          - name: created_at
            description: Timestamp the candidate record was created.
          - name: first_name
            description: First name of the candidate.
          - name: last_name
            description: Last name of the candidate.
          - name: private
            description: Boolean that is true if the candidate is private.
          - name: last_activity_at
            description: Timestamp of the most recent activity on this candidate.
          - name: title
            description: Current job title of the candidate.
          - name: updated_at
            description: Timestamp the candidate record was last updated.
          - name: can_email
            description: True if the candidate has not opted out of email communications.
          - name: preferred_name
            description: The name the candidate prefers to go by, if different from their full name.
          - name: time_zone
            description: The candidate's preferred time zone.

      - name: candidate_tag_link
        identifier: "{{ var('greenhouse_candidate_tag_link_identifier', 'candidate_tag_link')}}"
        description: Table associating candidates with their attached tags.
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the candidate-tag link has been soft-deleted from Greenhouse.
          - name: candidate_id
            description: Foreign key referencing the CANDIDATE who is tagged.
          - name: index
            description: Position of this tag in the candidate's tag list. Part of the composite primary key with `candidate_id`.
          - name: tag_name
            description: Denormalized name of the tag. References `candidate_tag.name`.

      - name: department
        identifier: "{{ var('greenhouse_department_identifier', 'department')}}"
        description: Table storing an organization's job departments.
        config:
          enabled: "{{ var('greenhouse_using_job_department', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the department has been soft-deleted from Greenhouse.
          - name: external_id
            description: An arbitrary ID provided by an external source; does not map to another entity in Greenhouse.
          - name: id
            description: Unique ID of the department.
          - name: name
            description: The department's name.
          - name: parent_id
            description: Self-referencing parent department ID.
          - name: created_at
            description: Timestamp the department was created.
          - name: updated_at
            description: Timestamp the department was last updated.

      - name: eeoc
        identifier: "{{ var('greenhouse_eeoc_identifier', 'eeoc')}}"
        description: Table capturing EEOC data provided by candidates.
        config:
          enabled: "{{ var('greenhouse_using_eeoc', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the EEOC response has been soft-deleted from Greenhouse.
          - name: id
            description: Unique identifier for the EEOC response.
          - name: application_id
            description: Foreign key referencing the ID of the application with this EEOC data.
          - name: candidate_id
            description: Foreign key referencing the CANDIDATE who submitted this response.
          - name: disability_status_description
            description: Description of the applicant's disability status.
          - name: disability_status_id
            description: Foreign key referencing the status' DEMOGRAPHIC_ANSWER_OPTION ID.
          - name: gender_description
            description: Description of the applicant's gender identity.
          - name: gender_id
            description: Foreign key referencing the gender identity's DEMOGRAPHIC_ANSWER_OPTION ID.
          - name: race_description
            description: Description of applicant's provided race.
          - name: race_id
            description: Foreign key referencing the racial identity's DEMOGRAPHIC_ANSWER_OPTION ID.
          - name: submitted_at
            description: Timestamp of when the EEOC data was submitted by the applicant.
          - name: veteran_status_description
            description: Description of the applicant's veteran status.
          - name: veteran_status_id
            description: Foreign key referencing the veteran status' DEMOGRAPHIC_ANSWER_OPTION ID.
          - name: created_at
            description: Timestamp the EEOC record was created.
          - name: updated_at
            description: Timestamp the EEOC record was last updated.

      - name: candidate_email_address
        identifier: "{{ var('greenhouse_candidate_email_address_identifier', 'candidate_email_address')}}"
        description: Table storing email addresses associated with candidates.
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the email address has been soft-deleted from Greenhouse.
          - name: candidate_id
            description: Foreign key referencing the CANDIDATE whose email this is.
          - name: index
            description: Index of this individual email among all emails associated with this candidate.
          - name: type
            description: Type of email address - work, other, personal.
          - name: value
            description: The candidate's email address.

      - name: job_hiring_manager
        identifier: "{{ var('greenhouse_job_hiring_manager_identifier', 'job_hiring_manager')}}"
        description: Table capturing hiring managers assigned to each job.
        config:
          enabled: "{{ var('greenhouse_using_job_hiring_manager', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the job hiring manager record has been soft-deleted from Greenhouse.
          - name: id
            description: Unique ID of the job hiring manager record.
          - name: job_id
            description: Foreign key referencing the JOB this hiring manager is assigned to.
          - name: user_id
            description: Foreign key referencing the USER who is the hiring manager.
          - name: created_at
            description: Timestamp of when the record was created.
          - name: updated_at
            description: Timestamp of when the record was last updated.

      - name: job_owner
        identifier: "{{ var('greenhouse_job_owner_identifier', 'job_owner')}}"
        description: Table capturing owners (recruiters, sourcers, coordinators) assigned to each job.
        config:
          enabled: "{{ var('greenhouse_using_job_owner', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the job owner record has been soft-deleted from Greenhouse.
          - name: id
            description: Unique ID of the job owner record.
          - name: job_id
            description: Foreign key referencing the JOB this owner is assigned to.
          - name: user_id
            description: Foreign key referencing the USER who owns this job.
          - name: type
            description: One of - sourcer, recruiter, coordinator.
          - name: responsible
            description: Whether this owner is marked as responsible.
          - name: created_at
            description: Timestamp of when the record was created.
          - name: updated_at
            description: Timestamp of when the record was last updated.

      - name: job
        identifier: "{{ var('greenhouse_job_identifier', 'job')}}"
        description: Table capturing all jobs stored in Greenhouse.
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the job has been soft-deleted from Greenhouse.
          - name: closed_at
            description: Timestamp of when the last opening for this job closed.
          - name: confidential
            description: Boolean that is true if the job is confidential.
          - name: created_at
            description: Timestamp of when the job was created.
          - name: id
            description: Unique ID of the job.
          - name: name
            description: Title of the job role.
          - name: notes
            description: Notes on the hiring plan.
          - name: requisition_id
            description: The id of the requisition corresponding to this job posting, if applicable.
          - name: status
            description: One of open, closed, draft.
          - name: updated_at
            description: Timestamp of when the job was last updated.
          - name: department_id
            description: Foreign key referencing the DEPARTMENT this job belongs to.
          - name: copied_from_id
            description: Foreign key referencing the JOB this was cloned from. Null for jobs created from scratch.
          - name: is_template
            description: True if this job is a template used to scaffold new jobs rather than an active requisition.
          - name: opened_at
            description: Timestamp of when the job first transitioned to open.

      - name: job_office
        identifier: "{{ var('greenhouse_job_office_identifier', 'job_office')}}"
        description: Table relating jobs to the offices they exist in.
        config:
          enabled: "{{ var('greenhouse_using_job_office', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the job-office relationship has been soft-deleted from Greenhouse.
          - name: office_id
            description: Foreign key referencing the OFFICE associated with this job.
          - name: job_id
            description: Foreign key referencing the JOB.
          - name: index
            description: Position of this office in the job's office list. Part of the composite primary key.

      - name: opening
        identifier: "{{ var('greenhouse_opening_identifier', 'opening')}}"
        description: Table capturing openings made for jobs.
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the opening has been soft-deleted from Greenhouse.
          - name: application_id
            description: >
              Foreign key referencing the APPLICATION that was used to fill this opening.
              This should only be set on a closed opening, null otherwise.
          - name: close_reason_id
            description: Foreign key referencing the CLOSE_REASON for this opening.
          - name: closed_at
            description: Timestamp of when this opening was closed.
          - name: id
            description: Unique ID of the job opening.
          - name: job_id
            description: >
              Foreign key referencing the id of the JOB that this opening exists for.
              A job can have multiple openings.
          - name: opened_at
            description: Timestamp of when the job was opened.
          - name: opening_id
            description: Opening ID visible from the UI.
          - name: is_open
            description: True if the opening is currently available to be filled.
          - name: sort_order
            description: Position of this opening within the job's openings list.
          - name: target_start_on
            description: Target start date for the hire that will fill this opening (YYYY-MM-DD). Null when no target start date has been set.
          - name: created_at
            description: Timestamp the opening was created.
          - name: updated_at
            description: Timestamp the opening was last updated.

      - name: job_post
        identifier: "{{ var('greenhouse_job_post_identifier', 'job_post')}}"
        description: Table capturing the online job posts for an organization's jobs (as seen on the Job Board).
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the job post has been soft-deleted from Greenhouse.
          - name: content
            description: The text of the job post as posted to the external job board.
          - name: created_at
            description: Timestamp of when the job post was created.
          - name: id
            description: Unique ID of the job post.
          - name: internal
            description: If true, this job post is on an internal job board and visible only to existing employees.
          - name: internal_content
            description: The text of the job post if posted to the internal job board, if different than the external job board.
          - name: job_id
            description: Foreign key referencing the JOB this post is for.
          - name: live
            description: If true, this job post status is set to live.
          - name: title
            description: Title of the job post.
          - name: updated_at
            description: Timestamp of when the job post was last updated.
          - name: active
            description: If true, the post has not been deleted. Deleted posts are excluded by default.
          - name: featured
            description: If true, the post is currently featured on the organization's internal job board. Only internal posts can be featured.
          - name: first_published_at
            description: Timestamp the post first transitioned to live. Null for posts that have never been published.
          - name: job_board_id
            description: Foreign key referencing the JOB_BOARD this post is published to.
          - name: language_code
            description: ISO 639-1 locale of the post (e.g. en, fr, ja). Null when no locale has been chosen.
          - name: public_url
            description: Canonical public URL of the post on its job board. Null when the post has no associated job board or the board has no public URL configured.
          - name: demographic_question_set_id
            description: Foreign key referencing the demographic question set surfaced to candidates on this post for DE&I reporting. Null when the post does not collect demographic data.

      - name: job_post_location
        identifier: "{{ var('greenhouse_job_post_location_identifier', 'job_post_location')}}"
        description: Table capturing the locations associated with job posts.
        config:
          enabled: "{{ var('greenhouse_using_job_post_location', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the location entry has been soft-deleted from Greenhouse.
          - name: id
            description: Unique ID of the location entry.
          - name: job_post_id
            description: Foreign key referencing the JOB_POST this location is attached to.
          - name: office_id
            description: Foreign key referencing the OFFICE this location resolves to. Populated when type is `office`; null otherwise.
          - name: custom_location_id
            description: Id of the board-scoped custom location this entry resolves to. Populated when type is `custom_list`; null otherwise.
          - name: plain_text_location
            description: Free-text location string shown on the job post. Populated when type is `free_text`; null otherwise.
          - name: type
            description: How this location is sourced. One of `free_text`, `office`, or `custom_list`.
          - name: created_at
            description: Timestamp the location entry was created.
          - name: updated_at
            description: Timestamp the location entry was last updated.

      - name: job_interview_stage
        identifier: "{{ var('greenhouse_job_interview_stage_identifier', 'job_interview_stage')}}"
        description: Table capturing each stage of a job's interview plan.
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the interview stage has been soft-deleted from Greenhouse.
          - name: id
            description: Unique ID of the interview stage.
          - name: job_id
            description: Foreign key referencing the JOB whose interview plan this stage belongs to.
          - name: name
            description: Name of the stage as it appears on the job's interview plan.
          - name: active
            description: True if the stage is on the job's current interview plan. Inactive stages are retained so historical application_stage rows continue to resolve.
          - name: sort_order
            description: Position of this stage within the job's interview plan, ascending. The first stage is 0.
          - name: created_at
            description: Timestamp the stage was created.
          - name: updated_at
            description: Timestamp the stage was last updated.

      - name: office
        identifier: "{{ var('greenhouse_office_identifier', 'office')}}"
        description: Table capturing an organization's offices.
        config:
          enabled: "{{ var('greenhouse_using_job_office', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the office has been soft-deleted from Greenhouse.
          - name: external_id
            description: An arbitrary ID provided by an external source; does not map to another entity in Greenhouse.
          - name: id
            description: Unique ID of the office.
          - name: location
            description: The office's physical location.
          - name: name
            description: The office's name.
          - name: parent_id
            description: Self-referencing id of the office's parent office.
          - name: primary_in_house_contact_user_id
            description: >
              Foreign key referencing the id of the USER who will be the primary in-house contact for
              this office.
          - name: created_at
            description: Timestamp the office was created.
          - name: updated_at
            description: Timestamp the office was last updated.

      - name: candidate_phone_number
        identifier: "{{ var('greenhouse_candidate_phone_number_identifier', 'candidate_phone_number')}}"
        description: Table capturing phone numbers associated with candidates.
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the phone number has been soft-deleted from Greenhouse.
          - name: candidate_id
            description: Foreign key referencing the CANDIDATE with this phone.
          - name: index
            description: Index of the phone number amongst phone numbers associated with this candidate.
          - name: type
            description: Type of phone.
          - name: value
            description: Candidate's phone number.

      - name: interview
        identifier: "{{ var('greenhouse_interview_identifier', 'interview')}}"
        description: Table storing interviews scheduled for the specified application.
        config:
          enabled: "{{ var('greenhouse_using_interview', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the scheduled interview has been soft-deleted from Greenhouse.
          - name: id
            description: Unique identifier for the scheduled interview.
          - name: application_id
            description: Foreign key referencing the APPLICATION.
          - name: job_interview_id
            description: Foreign key referencing the JOB_INTERVIEW_STAGE this interview maps to.
          - name: job_id
            description: Foreign key referencing the JOB.
          - name: location
            description: Location of the interview.
          - name: organizer_id
            description: Foreign key referencing the USER who organized the interview.
          - name: status
            description: One of `scheduled`, `awaiting_feedback`, `complete`.
          - name: created_at
            description: Timestamp the record was created.
          - name: updated_at
            description: Timestamp the record was last updated.
          - name: starts_at
            description: Interview start timestamp.
          - name: ends_at
            description: Interview end timestamp.
          - name: scheduled_at
            description: Timestamp the interview was first placed on calendar.
          - name: availability_received_at
            description: Timestamp availability was received from the candidate.
          - name: all_day_start_on
            description: Start date for all-day events.
          - name: all_day_end_on
            description: End date for all-day events.
          - name: external_event_id
            description: Calendar event id on the organizer's external calendar.
          - name: video_conferencing_url
            description: Video conferencing link auto-populated by Zoom, Google Meet, or Teams integrations.

      - name: interviewer
        identifier: "{{ var('greenhouse_interviewer_identifier', 'interviewer')}}"
        description: Table relating users to the scheduled interviews they participated in.
        config:
          enabled: "{{ var('greenhouse_using_interviewer', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the interviewer record has been soft-deleted from Greenhouse.
          - name: id
            description: Unique identifier for the interviewer record.
          - name: user_id
            description: Foreign key referencing the USER conducting the interview.
          - name: interview_id
            description: Foreign key referencing the SCHEDULED_INTERVIEW.
          - name: scorecard_id
            description: Foreign key referencing the SCORECARD for this interviewer's feedback.
          - name: email
            description: Primary email for internal users; raw calendar invitee address for external attendees.
          - name: response_status
            description: Calendar RSVP status.
          - name: created_at
            description: Timestamp the record was created.
          - name: updated_at
            description: Timestamp the record was last updated.

      - name: scorecard
        identifier: "{{ var('greenhouse_scorecard_identifier', 'scorecard')}}"
        description: All submitted scorecards for candidate interviews.
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the scorecard has been soft-deleted from Greenhouse.
          - name: application_id
            description: Foreign key referencing the APPLICATION for which the scorecard was submitted.
          - name: created_at
            description: Timestamp of when the scorecard was created.
          - name: id
            description: Unique ID of the scorecard.
          - name: interviewed_at
            description: Timestamp of when the interview begun.
          - name: candidate_rating
            description: Overall recommendation recorded on the scorecard. Values - strong_no, no, yes, strong_yes, no_decision.
          - name: interviewer_id
            description: Foreign key referencing the USER designated as the interviewer on this scorecard.
          - name: interview_kit_id
            description: Foreign key referencing the interview kit (question set) used for this scorecard.
          - name: submitted_at
            description: Timestamp of when the scorecard was submitted.
          - name: submitter_id
            description: Foreign key referencing the USER who submitted the scorecard.
          - name: updated_at
            description: Timestamp of when the scorecard was last updated.
          - name: notes
            description: Free-text interviewer notes.
          - name: notes_with_tags
            description: Notes with @-mention markup preserved.
          - name: private_notes
            description: Notes visible only to the submitter and admins.
          - name: private_notes_with_tags
            description: Private notes with @-mention markup preserved.
          - name: public_notes
            description: Notes visible to all users with candidate access.
          - name: public_notes_with_tags
            description: Public notes with @-mention markup preserved.
          - name: status
            description: Submission state of the scorecard. One of `in_progress` or `complete`.

      - name: scorecard_candidate_attribute
        identifier: "{{ var('greenhouse_scorecard_candidate_attribute_identifier', 'scorecard_candidate_attribute')}}"
        description: Table capturing ratings along individual attribute standards within each scorecard.
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the attribute rating has been soft-deleted from Greenhouse.
          - name: id
            description: Unique identifier for the scorecard attribute rating.
          - name: scorecard_id
            description: Foreign key referencing the SCORECARD this attribute rating belongs to.
          - name: job_candidate_attribute_id
            description: Foreign key referencing the attribute definition.
          - name: candidate_attribute_rating
            description: Interviewer's rating for this attribute.
          - name: note
            description: Additional notes from the interviewer regarding the attribute score.
          - name: created_at
            description: Timestamp the attribute rating was created.
          - name: updated_at
            description: Timestamp the attribute rating was last updated.

      - name: candidate_social_media_address
        identifier: "{{ var('greenhouse_candidate_social_media_address_identifier', 'candidate_social_media_address')}}"
        description: Table capturing social media links (ie linkedin, github) provided by candidates.
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the social media link has been soft-deleted from Greenhouse.
          - name: candidate_id
            description: Foreign key referencing the CANDIDATE associated with these links.
          - name: index
            description: Index of the social media link amongst the candidate's stored links.
          - name: value
            description: The candidate's social media link.

      - name: source
        identifier: "{{ var('greenhouse_source_identifier', 'source')}}"
        description: Table capturing an organization's applicant sources.
        config:
          freshness: null
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the source has been soft-deleted from Greenhouse.
          - name: id
            description: Unique ID of the source.
          - name: name
            description: Name of the source.
          - name: type_id
            description: ID of the category of source.
          - name: type_name
            description: >
              Name of the source category. One of - attend_events, referrals, third_party_boards,
              candidate_search, other, social_media, company_marketing, agencies, prospecting.
          - name: created_at
            description: Timestamp the source was created.
          - name: updated_at
            description: Timestamp the source was last updated.

      - name: users
        identifier: "{{ var('greenhouse_users_identifier', 'users')}}"
        description: Table of an organization's Greenhouse users.
        config:
          freshness: null
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the user has been soft-deleted from Greenhouse.
          - name: created_at
            description: Timestamp of when the user was created.
          - name: deactivated
            description: Boolean that is true if the user account has been deactivated.
          - name: employee_id
            description: The user's external employee id.
          - name: first_name
            description: User's first name.
          - name: last_name
            description: User's last name.
          - name: id
            description: Unique ID of the user.
          - name: site_admin
            description: If true, this user is a site admin, which means the user has full permissions on all non-private jobs.
          - name: updated_at
            description: Timestamp of when the user was updated.
          - name: agency_id
            description: Foreign key referencing the AGENCY this user belongs to. Null for in-house users.
          - name: job_title
            description: Free-form job title from the user's Greenhouse profile. Null when unset.
          - name: primary_email
            description: Sign-in email address. Empty string for service accounts.

      - name: user_email
        identifier: "{{ var('greenhouse_user_email_identifier', 'user_email')}}"
        description: Table associating Greenhouse users with their emails.
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the user email record has been soft-deleted from Greenhouse.
          - name: id
            description: Unique identifier for the user email record.
          - name: email
            description: User's email.
          - name: user_id
            description: Foreign key referencing the USER who has this email.
          - name: verified
            description: True once the user has confirmed this address via the verification link. False when verification is pending.
          - name: verification_token_sent_at
            description: Timestamp when the verification email was dispatched. Null when no verification email has been sent.
          - name: created_at
            description: Timestamp the email address record was created.
          - name: updated_at
            description: Timestamp the email address record was last updated.

      - name: prospect_pool
        identifier: "{{ var('greenhouse_prospect_pool_identifier', 'prospect_pool')}}"
        description: Table capturing prospect pool groups.
        config:
          enabled: "{{ var('greenhouse_using_prospects', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the prospect pool has been soft-deleted from Greenhouse.
          - name: active
            description: Boolean that is false if the pool is hidden from view in Greenhouse.
          - name: id
            description: Unique ID of the prospect pool.
          - name: name
            description: Name given to the prospect pool.
          - name: description
            description: Free-text purpose statement set by the organization. Null when no description has been set.
          - name: created_at
            description: Timestamp the prospect pool was created.
          - name: updated_at
            description: Timestamp the prospect pool was last updated.

      - name: prospect_pool_stage
        identifier: "{{ var('greenhouse_prospect_pool_stage_identifier', 'prospect_pool_stage')}}"
        description: Table capturing stages prospects in different pools advance through.
        config:
          enabled: "{{ var('greenhouse_using_prospects', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the prospect stage has been soft-deleted from Greenhouse.
          - name: id
            description: Unique id of the prospect stage.
          - name: name
            description: Name of the prospect stage.
          - name: prospect_pool_id
            description: Foreign key referencing the PROSPECT_POOL the stage belongs to.
          - name: sort_order
            description: Position of this stage within the pool, ascending. Lower values appear first.
          - name: created_at
            description: Timestamp the stage was created.
          - name: updated_at
            description: Timestamp the stage was last updated.

      - name: referrer
        identifier: "{{ var('greenhouse_referrer_identifier', 'referrer')}}"
        description: Table mapping an application referral to the USER who made it.
        config:
          enabled: "{{ var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the referrer record has been soft-deleted from Greenhouse.
          - name: id
            description: Unique id of the referrer record. Referenced by `application.referrer_id`.
          - name: name
            description: Full name of the referrer.
          - name: user_id
            description: Foreign key referencing the USER who made the referral.
          - name: created_at
            description: Timestamp the referrer record was created.
          - name: updated_at
            description: Timestamp the referrer record was last updated.

      - name: prospect_detail
        identifier: "{{ var('greenhouse_prospect_detail_identifier', 'prospect_detail')}}"
        description: Table capturing the prospect pool/stage/owner details for prospect applications.
        config:
          enabled: "{{ var('greenhouse_using_prospect_detail', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the prospect detail record has been soft-deleted from Greenhouse.
          - name: id
            description: Unique ID of the prospect detail record.
          - name: application_id
            description: Foreign key referencing the prospect APPLICATION this record belongs to.
          - name: department_id
            description: Foreign key referencing the DEPARTMENT the prospect is being considered for.
          - name: office_id
            description: Foreign key referencing the OFFICE the prospect is being considered for.
          - name: pool_id
            description: Foreign key referencing the prospect pool the prospect sits in.
          - name: pool_stage_id
            description: Foreign key referencing the prospect pool stage the prospect sits in.
          - name: prospect_owner_id
            description: Foreign key referencing the USER who owns this prospect.
          - name: created_at
            description: Timestamp the record was created.
          - name: updated_at
            description: Timestamp the record was last updated.

      - name: job_candidate_attribute
        identifier: "{{ var('greenhouse_job_candidate_attribute_identifier', 'job_candidate_attribute')}}"
        description: Table capturing the candidate attributes (skills, traits) configured on a job's scorecard.
        config:
          enabled: "{{ var('greenhouse_using_job_candidate_attribute', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the job candidate attribute record has been soft-deleted from Greenhouse.
          - name: id
            description: Unique ID of the job candidate attribute.
          - name: job_id
            description: Foreign key referencing the JOB this attribute belongs to.
          - name: candidate_attribute_type_id
            description: Foreign key referencing the attribute's type definition.
          - name: active
            description: Boolean that is true if the attribute is currently in use on the job.
          - name: name
            description: Display name of the attribute (e.g. "JavaScript", "Leadership").
          - name: sort_order
            description: Display priority of the attribute within the job's attribute list.
          - name: created_at
            description: Timestamp the record was created.
          - name: updated_at
            description: Timestamp the record was last updated.

      - name: scorecard_question
        identifier: "{{ var('greenhouse_scorecard_question_identifier', 'scorecard_question')}}"
        description: Table capturing the questions configured on an interview kit's scorecard.
        config:
          enabled: "{{ var('greenhouse_using_scorecard_question', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the scorecard question record has been soft-deleted from Greenhouse.
          - name: id
            description: Unique ID of the scorecard question.
          - name: interview_kit_id
            description: Foreign key referencing the INTERVIEW_KIT this question belongs to.
          - name: active
            description: Boolean that is true if the question is currently in use.
          - name: answer_type
            description: Shape of the expected answer (e.g. text, yes/no, single select, multi select, instruction).
          - name: question
            description: Text of the scorecard question.
          - name: required
            description: Boolean that is true if an interviewer must answer this question before submitting the scorecard.
          - name: sort_order
            description: Display order of the question within its interview kit.
          - name: created_at
            description: Timestamp the record was created.
          - name: updated_at
            description: Timestamp the record was last updated.

      - name: scorecard_question_answer
        identifier: "{{ var('greenhouse_scorecard_question_answer_identifier', 'scorecard_question_answer')}}"
        description: Table capturing an interviewer's answer to a scorecard question.
        config:
          enabled: "{{ var('greenhouse_using_scorecard_question', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the scorecard question answer record has been soft-deleted from Greenhouse.
          - name: id
            description: Unique ID of the scorecard question answer.
          - name: scorecard_question_id
            description: Foreign key referencing the SCORECARD_QUESTION being answered.
          - name: scorecard_id
            description: Foreign key referencing the SCORECARD this answer belongs to.
          - name: answer
            description: Free-text answer provided by the interviewer.
          - name: answer_with_tag
            description: Free-text answer with @-mentions preserved as tags.
          - name: boolean_value
            description: Yes/no answer provided by the interviewer, for yes/no questions.
          - name: created_at
            description: Timestamp the record was created.
          - name: updated_at
            description: Timestamp the record was last updated.
          - name: value
            description: Selected option value, for select-type questions.

      - name: job_interview
        identifier: "{{ var('greenhouse_job_interview_identifier', 'job_interview')}}"
        description: Table capturing the interview slots configured on a job's interview plan.
        config:
          enabled: "{{ var('greenhouse_using_interview', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the job interview record has been soft-deleted from Greenhouse.
          - name: id
            description: Unique ID of the job interview slot.
          - name: job_interview_stage_id
            description: Foreign key referencing the JOB_INTERVIEW_STAGE this slot belongs to.
          - name: job_id
            description: Foreign key referencing the JOB this slot is defined on.
          - name: active
            description: Boolean that is true if the slot is on the job's current interview plan.
          - name: duration
            description: Default length of the interview, in minutes.
          - name: instruction
            description: Interviewer-facing instructions for this slot.
          - name: name
            description: Name of the interview slot (e.g. "Recruiter Phone Screen").
          - name: require_scorecard
            description: Boolean that is true if interviewers must submit a scorecard for this slot.
          - name: scheduling_type
            description: How the slot is fulfilled (e.g. needs scheduling, take-home test, offer).
          - name: sort_order
            description: Position of this slot within its interview stage.
          - name: summary
            description: Candidate-facing summary for this slot.
          - name: created_at
            description: Timestamp the record was created.
          - name: updated_at
            description: Timestamp the record was last updated.

      - name: interview_kit
        identifier: "{{ var('greenhouse_interview_kit_identifier', 'interview_kit')}}"
        description: Table capturing per-slot interview kit configuration (anonymization, exercises).
        config:
          enabled: "{{ var('greenhouse_using_interview_kit', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the interview kit record has been soft-deleted from Greenhouse.
          - name: id
            description: Unique ID of the interview kit.
          - name: job_id
            description: Foreign key referencing the JOB this kit is configured on.
          - name: job_interview_id
            description: Foreign key referencing the JOB_INTERVIEW slot this kit belongs to.
          - name: anonymize_candidate
            description: Boolean that is true if candidate details are hidden from graders for this slot.
          - name: anonymize_resumes
            description: Boolean that is true if resumes are anonymized for reviewers for this slot.
          - name: exercises
            description: Interview prep content (instructions, exercises, rubric notes) for this slot.
          - name: created_at
            description: Timestamp the record was created.
          - name: updated_at
            description: Timestamp the record was last updated.

      - name: rejection_reason
        identifier: "{{ var('greenhouse_rejection_reason_identifier', 'rejection_reason')}}"
        description: Lookup table of rejection reasons and their categories.
        config:
          enabled: "{{ var('greenhouse_using_rejection_reason', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the rejection reason record has been soft-deleted from Greenhouse.
          - name: id
            description: Unique ID of the rejection reason.
          - name: name
            description: Display label for the rejection reason (e.g. "Not a cultural fit").
          - name: type_id
            description: Foreign key referencing the rejection reason's category.
          - name: type_key
            description: Stable machine-readable key for the rejection reason's category.
          - name: type_name
            description: Display name of the rejection reason's category.
          - name: created_at
            description: Timestamp the record was created.
          - name: updated_at
            description: Timestamp the record was last updated.

      - name: rejection_detail
        identifier: "{{ var('greenhouse_rejection_detail_identifier', 'rejection_detail')}}"
        description: Table capturing who rejected an application, why, and when.
        config:
          enabled: "{{ var('greenhouse_using_rejection_detail', true) and var('greenhouse_sources', []) == [] }}"
        columns:
          - name: _fivetran_deleted
            description: Boolean that is true if the rejection detail record has been soft-deleted from Greenhouse.
          - name: id
            description: Unique ID of the rejection detail record.
          - name: application_id
            description: Foreign key referencing the APPLICATION this rejection belongs to.
          - name: rejected_by_id
            description: Foreign key referencing the USER who rejected the application.
          - name: rejection_reason_id
            description: Foreign key referencing the REJECTION_REASON selected for the application.
          - name: rejected_at
            description: Timestamp the application was rejected.
          - name: rejection_note_id
            description: Foreign key referencing the note capturing the free-text rejection message.
          - name: created_at
            description: Timestamp the record was created.
          - name: updated_at
            description: Timestamp the record was last updated.

