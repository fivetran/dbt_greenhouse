version: 2

models:
  - name: stg_greenhouse__activity
    description: Table capturing lists of activities on a candidate's profile, including interviews, notes, and emails.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: body
        description: Content of the activity taken. 
      - name: candidate_id
        description: Foreign key referencing the CANDIDATE whose profile was acted upon. 
      - name: occurred_at
        description: Timestamp of when the activity occurred.
      - name: activity_id
        description: The internal Greenhouse ID of the activity feed note.
      - name: subject
        description: Subject of the activity.
      - name: user_id
        description: Foreign key referencing the USER who performed the activity.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__application
    description: Table capturing all applications (candidates + prospects).
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: application_id
        description: Unique identifier for the application.
        tests:
          - not_null
      - name: candidate_id
        description: Id of the candidate (person) this application belongs to.
      - name: last_activity_at
        description: Timestamp of the most recent activity on this application (notes, emails, stage changes, etc.).
      - name: location_address
        description: Free-form location string captured on the application, typically from the job post's location question.
      - name: is_prospect
        description: True for prospect applications (sourced candidates not yet attached to a single job); false for candidate applications on a specific job.
      - name: rejected_at
        description: Timestamp the application was rejected. Null for applications that have not been rejected.
      - name: source_id
        description: Id of the source the application is attributed to (e.g. a job board, an event, an employee referral source). Null if no source is set.
      - name: status
        description: Lifecycle status of the application. `active` for in-process candidates, `rejected` for rejected applications, `hired` once an offer is closed, and `converted` for prospect applications promoted to a candidate application.
      - name: stage_id
        description: Id of the interview stage the candidate is currently in. Null for prospect applications and applications in a terminal state.
      - name: coordinator_id
        description: Id of the user assigned as coordinator on the application's job. Null when unassigned.
      - name: job_id
        description: Id of the job this application is on. Null for jobless prospect applications.
      - name: job_post_id
        description: Id of the job post the candidate applied through. Null if the application was created internally rather than from a posted role.
      - name: recruiter_id
        description: Id of the user assigned as recruiter on the application's job. Null when unassigned.
      - name: referrer_id
        description: Id of the referrer who credited this application. Null if there was no referral. References a referrer, not a Greenhouse user.
      - name: agency_note_id
        description: Id of the note created when the candidate was submitted by an agency. Null if the application did not come through an agency.
      - name: needs_decision
        description: True when the application is waiting on a hiring-team decision (scorecard completion, advance/reject, etc.) in its current stage.
      - name: created_at
        description: Timestamp the application record was created. Note this is the system creation timestamp, not equivalent to the deprecated `applied_at` field.
      - name: updated_at
        description: Timestamp the application record was last updated.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__application_history
    description: Table capturing the history of applications as they advance through job stages.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: application_id
        description: Foreign key referencing the APPLICATION that was updated.
      - name: new_stage_id
        description: Foreign key referencing the JOB_STAGE that the application was advanced to.
      - name: new_status
        description: Status of the application as of this updated. 
      - name: updated_at
        description: Timestamp of when the application was advanced.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__attachment
    description: Table capturing files attached to the candidate profile.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: id
        description: Unique identifier for the attachment.
      - name: candidate_id
        description: Id of the candidate this attachment belongs to.
      - name: application_id
        description: Id of the application this attachment is associated with.
      - name: filename
        description: Name of the attached file.
      - name: type
        description: Type of attachment (e.g. resume, cover_letter, other).
      - name: url
        description: URL to access the attachment.
      - name: created_at
        description: Timestamp the attachment was created.
      - name: updated_at
        description: Timestamp the attachment was last updated.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__candidate
    description: Table capturing an organization's candidates.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: candidate_id
        description: Unique identifier for the candidate.
        tests:
          - not_null
      - name: current_company
        description: Current company the candidate works at.
      - name: created_at
        description: Timestamp the candidate record was created.
      - name: full_name
        description: Full name of the candidate, concatenated from `first_name` and `last_name`.
      - name: current_title
        description: Current job title of the candidate.
      - name: last_updated_at
        description: Timestamp the candidate record was last updated.
      - name: last_activity_at
        description: Timestamp of the most recent activity on this candidate.
      - name: is_private
        description: True if the candidate profile is marked private, restricting visibility to authorized users.
      - name: can_email
        description: True if the candidate has not opted out of email communications.
      - name: preferred_name
        description: The name the candidate prefers to go by, if different from their full name.
      - name: time_zone
        description: The candidate's preferred time zone.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__candidate_tag_link
    description: Table associating candidates with their attached tags.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: candidate_id
        description: Foreign key referencing the CANDIDATE who is tagged.
      - name: index
        description: Position of this tag among the candidate's tags. Part of the composite primary key with `candidate_id`.
      - name: tag_name
        description: Name of the tag attached to this candidate. Denormalized from the tag dimension.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__department
    description: Table storing an organization's job departments.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: department_id
        description: Unique identifier for the department.
        tests:
          - not_null
      - name: external_department_id
        description: Partner-supplied identifier for the department, typically the matching id from an HRIS or other external system. Null when no external id has been set.
      - name: name
        description: Display name of the department (e.g. Engineering, Marketing).
      - name: parent_department_id
        description: Id of the parent department in the organization's department tree. Null for top-level departments.
      - name: created_at
        description: Timestamp the department was created.
      - name: updated_at
        description: Timestamp the department was last updated.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__eeoc
    description: Table capturing EEOC data provided by candidates.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: id
        description: Unique identifier for the EEOC response.
      - name: application_id
        description: Id of the application this EEOC response is attached to. Each application has at most one EEOC response.
        tests:
          - not_null
      - name: candidate_id
        description: Id of the candidate who submitted this response.
      - name: submitted_at
        description: Timestamp the candidate submitted the EEOC questionnaire. Null while the questionnaire has been requested but not yet responded to.
      - name: gender_id
        description: Id of the candidate's self-identified gender. Null when the candidate skipped the question.
      - name: gender_description
        description: Description of the candidate's self-identified gender (Male, Female, Decline To Self Identify). Null when skipped.
      - name: race_id
        description: Id of the candidate's self-identified race or ethnicity. Null when skipped.
      - name: race_description
        description: Description of the candidate's self-identified race or ethnicity. Null when skipped.
      - name: veteran_status_id
        description: Id of the candidate's self-identified protected-veteran status under VEVRAA. Null when skipped.
      - name: veteran_status_description
        description: Description of the candidate's self-identified veteran status. Null when skipped.
      - name: disability_status_id
        description: Id of the candidate's self-identified disability status under Section 503. Null when skipped.
      - name: disability_status_description
        description: Description of the candidate's self-identified disability status. Null when skipped.
      - name: created_at
        description: Timestamp the EEOC record was created.
      - name: updated_at
        description: Timestamp the EEOC record was last updated.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__candidate_email_address
    description: Table storing email addresses associated with candidates.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: candidate_id
        description: Foreign key referencing the CANDIDATE whose email this is.
      - name: index
        description: Index of this individual email among all emails associated with this candidate. 
      - name: type
        description: Type of email address - work, other, personal.
      - name: email
        description: The candidate's email address.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__job_hiring_manager
    description: Table capturing hiring managers assigned to each job.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: id
        description: Unique identifier for the job hiring manager record.
        tests:
          - not_null
      - name: job_id
        description: Id of the job this hiring manager is assigned to.
      - name: user_id
        description: Id of the user who is the hiring manager.
      - name: created_at
        description: Timestamp the record was created.
      - name: updated_at
        description: Timestamp the record was last updated.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__job_owner
    description: Table capturing owners (recruiters, sourcers, coordinators) assigned to each job.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: id
        description: Unique identifier for the job owner record.
        tests:
          - not_null
      - name: job_id
        description: Id of the job this owner is assigned to.
      - name: user_id
        description: Id of the user who owns this job.
      - name: type
        description: Role of this owner on the job. One of `sourcer`, `recruiter`, `coordinator`.
      - name: responsible
        description: Candidate responsibility scope for this owner (`active`, `inactive`, `future`, `all`).
      - name: created_at
        description: Timestamp the record was created.
      - name: updated_at
        description: Timestamp the record was last updated.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__job_interview_stage
    description: Table capturing each stage of a job's interview plan.
    columns:
      - name: job_stage_id
        description: Unique identifier for the interview stage.
        tests:
          - not_null
      - name: job_id
        description: Id of the job whose interview plan this stage belongs to.
      - name: created_at
        description: Timestamp the stage was created.
      - name: stage_name
        description: Name of the stage as it appears on the job's interview plan (e.g. Application Review, Phone Screen, Onsite, Offer).
      - name: last_updated_at
        description: Timestamp the stage was last updated.
      - name: active
        description: True if the stage is on the job's current interview plan. Inactive stages are retained so that historical application_stage rows continue to resolve, but no new applications enter them.
      - name: sort_order
        description: Position of this stage within the job's interview plan, ascending. The first stage (Application Review) is 0; Offer is always last.
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__job
    description: Table capturing all jobs stored in Greenhouse.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: job_id
        description: Unique identifier for the job.
        tests:
          - not_null
      - name: last_opening_closed_at
        description: Timestamp the job most recently transitioned to closed.
      - name: is_confidential
        description: True if the job is marked confidential, restricting its visibility within the organization.
      - name: created_at
        description: Timestamp the job was created.
      - name: job_title
        description: Internal name of the job as configured by the hiring team.
      - name: notes
        description: Internal notes on the job, visible to hiring team members.
      - name: requisition_id
        description: Partner-supplied requisition identifier. Not unique across the organization — multiple jobs may share a requisition id.
      - name: status
        description: Lifecycle status of the job (open, draft, closed).
      - name: last_updated_at
        description: Timestamp the job was last updated.
      - name: department_id
        description: Id of the department this job belongs to.
      - name: copied_from_id
        description: Id of the job this job was cloned from, if applicable. Null for jobs created from scratch.
      - name: is_template
        description: True if this job is a template used to scaffold new jobs rather than an active requisition.
      - name: opened_at
        description: Timestamp the job first transitioned to open.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__job_office
    description: Table relating jobs to the offices they exist in.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: job_id
        description: Id of the job this office assignment belongs to. Part of the composite primary key with `index`.
      - name: office_id
        description: Id of the office associated with this job. Part of the composite primary key with `index`.
      - name: index
        description: Position of this office in the job's office list. Part of the composite primary key.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__opening
    description: Table capturing openings made for jobs.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: application_id
        description: >
          Foreign key referencing the APPLICATION that was used to fill this opening. 
          This should only be set on a closed opening, null otherwise.
      - name: close_reason_id
        description: Foreign key referencing the CLOSE_REASON for this opening.
      - name: closed_at
        description: Timestamp of when this opening was closed.
      - name: job_opening_id
        description: Unique ID of the job opening.
      - name: job_id
        description: >
          Foreign key referencing the id of the JOB that this opening exists for.
          A job can have multiple openings.
      - name: opened_at
        description: Timestamp of when the job was opened.
      - name: opening_text_id
        description: Opening ID visible from the UI.
      - name: current_status
        description: True if the opening is currently open..
      - name: created_at
        description: Timestamp the opening record was created.
      - name: updated_at
        description: Timestamp the opening record was last updated.
      - name: sort_order
        description: Display order of this opening among the job's openings.
      - name: target_start_on
        description: Target start date for the hire filling this opening. Null when not set.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__job_post
    description: Table capturing the online job posts for an organization’s jobs (as seen on the Job Board).
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: job_post_id
        description: Unique identifier for the job post.
        tests:
          - not_null
      - name: content
        description: HTML body of the post shown to candidates on the job board. Null while the post is still being scaffolded.
      - name: created_at
        description: Timestamp the job post was created.
      - name: is_internal
        description: True if the post lives on an internal job board and is visible only to existing employees. False for external (public-facing) posts.
      - name: internal_content
        description: HTML body shown on the internal job board. Null for external-only posts.
      - name: job_id
        description: Id of the parent job this post belongs to. A single job can have multiple posts.
      - name: is_live
        description: True if the post is published and its job board is also live. A post on an unpublished board is not live.
      - name: title
        description: Public-facing title shown to candidates on the job board. Distinct from the internal `job.name`.
      - name: last_updated_at
        description: Timestamp the post was last updated.
      - name: active
        description: True if the post has not been deleted. Deleted posts are excluded by default.
      - name: featured
        description: True if the post is currently featured on the organization's internal job board. Only internal posts can be featured.
      - name: first_published_at
        description: Timestamp the post first transitioned to live. Null for posts that have never been published.
      - name: job_board_id
        description: Id of the job board this post is published to.
      - name: language_code
        description: ISO 639-1 locale of the post, used to render the candidate-facing application form in the matching language (e.g. en, fr, ja). Null when no locale has been chosen.
      - name: public_url
        description: Canonical public URL of the post on its job board. Null when the post has no associated job board or the board has no public URL configured.
      - name: demographic_question_set_id
        description: Id of the demographic question set surfaced to candidates on this post for DE&I reporting. Null when the post does not collect demographic data.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__job_post_location
    description: Table capturing the locations associated with job posts. Replaces the deprecated `JOB_POST.location_name` column.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: job_post_location_id
        description: Unique identifier for the location entry.
        tests:
          - not_null
      - name: job_post_id
        description: Id of the job post this location is attached to. A single post can have multiple rows — one per location it is published in.
      - name: office_id
        description: Id of the organization office this location resolves to. Populated when `type` is `office`; null otherwise.
      - name: custom_location_id
        description: Id of the board-scoped custom location this entry resolves to. Populated when `type` is `custom_list`; null otherwise.
      - name: plain_text_location
        description: Free-text location string shown on the job post (e.g. New York, NY, Remote (US)). Populated when `type` is `free_text`; null for `office` and `custom_list` rows.
      - name: type
        description: How this location is sourced. One of `free_text`, `office`, or `custom_list`.
      - name: created_at
        description: Timestamp the location entry was created.
      - name: updated_at
        description: Timestamp the location entry was last updated.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__office
    description: Table capturing an organization's offices.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: office_id
        description: Unique identifier for the office.
        tests:
          - not_null
      - name: external_office_id
        description: Stable identifier supplied by the customer or HRIS for cross-system reconciliation. Null when no external id has been set.
      - name: office_name
        description: Display name of the office (e.g. San Francisco, Remote (US)). Unique among active offices in the same organization.
      - name: parent_office_id
        description: Id of the parent office when offices are organized hierarchically. Null for top-level offices.
      - name: location_name
        description: Free-form physical location string for the office (e.g. New York, NY, USA). Null for offices that have no location set.
      - name: primary_contact_user_id
        description: Id of the Greenhouse user designated as the office's primary internal contact. Null when no contact has been assigned.
      - name: created_at
        description: Timestamp the office was created.
      - name: updated_at
        description: Timestamp the office was last updated.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__candidate_phone_number
    description: Table capturing phone numbers associated with candidates.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: candidate_id
        description: Foreign key referencing the CANDIDATE with this phone.
      - name: index
        description: Index of the phone number amongst phone numbers associated with this candidate.
      - name: phone_type
        description: Type of phone.
      - name: phone_number
        description: Candidate's phone number.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__interview
    description: Table storing interviews that have been scheduled for the specified application.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: scheduled_interview_id
        description: Unique identifier for the scheduled interview.
        tests:
          - not_null
      - name: application_id
        description: Id of the application this interview was scheduled for.
      - name: job_interview_id
        description: Id of the job interview stage this scheduled interview maps to.
      - name: job_id
        description: Id of the job this interview is associated with.
      - name: location
        description: Location of the interview.
      - name: organizer_user_id
        description: Id of the user who organized the interview.
      - name: status
        description: One of `scheduled`, `awaiting_feedback`, `complete`.
      - name: created_at
        description: Timestamp the interview record was created.
      - name: last_updated_at
        description: Timestamp the interview record was last updated.
      - name: starts_at
        description: Timestamp the interview is scheduled to start.
      - name: ends_at
        description: Timestamp the interview is scheduled to end.
      - name: scheduled_at
        description: Timestamp the interview was first placed on calendar via a Greenhouse integration.
      - name: availability_received_at
        description: Timestamp availability was received from the candidate, used to compute time-to-schedule.
      - name: all_day_start_on
        description: Start date for all-day events. Set instead of `starts_at` when the interview spans a full day.
      - name: all_day_end_on
        description: End date for all-day events. Set instead of `ends_at` when the interview spans a full day.
      - name: external_event_id
        description: Calendar event id on the organizer's external calendar (e.g. Google Calendar, Outlook).
      - name: video_conferencing_url
        description: Video conferencing link auto-populated by Zoom, Google Meet, or Teams integrations.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__interviewer
    description: Table relating users to the scheduled interviews they participated in (source table `interviewer`).
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: id
        description: Unique identifier for the interviewer record.
        tests:
          - not_null
      - name: interviewer_user_id
        description: Id of the user conducting the interview.
      - name: scheduled_interview_id
        description: Id of the scheduled interview this record belongs to.
      - name: scorecard_id
        description: Id of the scorecard associated with this interviewer's feedback.
      - name: email
        description: Primary email when `interviewer_user_id` is set; raw calendar invitee address for external attendees.
      - name: response_status
        description: Calendar RSVP status. One of `needs_action`, `accepted`, `tentative`, `declined`.
      - name: created_at
        description: Timestamp the record was created.
      - name: updated_at
        description: Timestamp the record was last updated.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}" 

  - name: stg_greenhouse__scorecard
    description: All submitted scorecards for candidate interviews.
    columns:
      - name: scorecard_id
        description: Unique ID of the scorecard.
        tests:
          - not_null
      - name: application_id
        description: Foreign key referencing the APPLICATION for which the scorecard was submitted.
      - name: interviewer_id
        description: Foreign key referencing the USER who conducted the interview.
      - name: interview_kit_id
        description: Foreign key referencing the interview kit (job_interview_stage) used for this scorecard.
      - name: candidate_rating
        description: Overall rating for the candidate. One of - strong_no, no, yes, strong_yes, no_decision.
      - name: status
        description: Status of the scorecard (e.g. submitted).
      - name: interviewed_at
        description: Timestamp of when the interview began.
      - name: submitted_at
        description: Timestamp of when the scorecard was submitted.
      - name: submitted_by_user_id
        description: Foreign key referencing the USER who submitted the scorecard (source column `submitter_id`).
      - name: created_at
        description: Timestamp of when the scorecard record was created.
      - name: last_updated_at
        description: Timestamp of when the scorecard was last updated.
      - name: notes
        description: Free-text notes on the scorecard.
      - name: notes_with_tags
        description: Scorecard notes with mention markup preserved.
      - name: private_notes
        description: Notes visible only to admins.
      - name: private_notes_with_tags
        description: Private notes with mention markup preserved.
      - name: public_notes
        description: Notes visible to the full hiring team.
      - name: public_notes_with_tags
        description: Public notes with mention markup preserved.
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__scorecard_candidate_attribute
    description: Table capturing per-attribute candidate ratings within each scorecard (source table `scorecard_candidate_attribute`).
    columns:
      - name: id
        description: Unique ID of this scorecard attribute rating.
        tests:
          - not_null
      - name: scorecard_id
        description: Foreign key referencing the SCORECARD this attribute rating belongs to.
      - name: job_candidate_attribute_id
        description: Foreign key referencing the attribute definition for this rating.
      - name: candidate_attribute_rating
        description: Rating given to the candidate for this individual attribute.
      - name: note
        description: Additional notes from the interviewer regarding this attribute.
      - name: created_at
        description: Timestamp of when this attribute rating was created.
      - name: updated_at
        description: Timestamp of when this attribute rating was last updated.
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__candidate_social_media_address
    description: Table capturing social media links (ie linkedin, github) provided by candidates.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: candidate_id
        description: Foreign key referencing the CANDIDATE associated with these links.
      - name: index
        description: Index of the social media link amongst the candidate's stored links.
      - name: url
        description: The candidate's social media link.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}" 

  - name: stg_greenhouse__source
    description: Table capturing an organization's applicant sources.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: source_id
        description: Unique identifier for the source.
        tests:
          - not_null
      - name: source_name
        description: Display name of the source as recruiters see it in Greenhouse (e.g. LinkedIn (Prospecting), Indeed, Referral).
      - name: source_type_id
        description: Id of the sourcing strategy this source rolls up to.
      - name: source_type_name
        description: Display name of the sourcing strategy (e.g. Agencies, Referral, Third-party boards, Prospecting, Social media).
      - name: created_at
        description: Timestamp the source was created.
      - name: updated_at
        description: Timestamp the source was last updated.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__users
    description: Table of an organization's Greenhouse users.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: user_id
        description: Unique identifier for the Greenhouse user.
        tests:
          - not_null
      - name: created_at
        description: Timestamp the user account was created.
      - name: employee_id
        description: Partner-supplied external employee identifier, typically the user's HRIS or payroll id. Null when no employee id has been set.
      - name: full_name
        description: Full name of the user, concatenated from `first_name` and `last_name`.
      - name: is_site_admin
        description: True if the user holds the Site Admin role, granting unrestricted access to every non-confidential job and to organization-level settings.
      - name: last_updated_at
        description: Timestamp the user record was last updated.
      - name: is_disabled
        description: True if the user has been deactivated. Deactivated users cannot sign in or be assigned to new jobs, but their historical activity is preserved.
      - name: agency_id
        description: Id of the staffing agency this user belongs to. Null for in-house users; non-null identifies the user as an external agency recruiter.
      - name: job_title
        description: Free-form job title set on the user's Greenhouse profile (e.g. Senior Recruiter). Null when unset.
      - name: primary_email
        description: Primary email address on the user's account — the sign-in identifier and address Greenhouse uses for outbound mail. Empty string for service accounts.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__user_email
    description: Table associating Greenhouse users with their emails.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: id
        description: Unique identifier for the user email record.
      - name: user_id
        description: Id of the Greenhouse user this email address belongs to.
      - name: email
        description: Email address associated with the user.
      - name: verified
        description: True once the user has confirmed this address via the verification link. False when verification is pending or was not required.
      - name: verification_token_sent_at
        description: Timestamp when the verification email was dispatched to this address. Null when no verification email has been sent.
      - name: created_at
        description: Timestamp the email address record was created.
      - name: updated_at
        description: Timestamp the email address record was last updated.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__prospect_pool
    description: Table capturing prospect pool groups.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: prospect_pool_id
        description: Unique identifier for the prospect pool.
        tests:
          - not_null
      - name: is_active
        description: True if the pool is currently in use. Inactive pools are hidden from CRM workflows but are retained so existing prospects remain queryable.
      - name: prospect_pool_name
        description: Name of the prospect pool, unique within the organization.
      - name: description
        description: Free-text purpose statement set by the organization (max 500 characters). Null when no description has been set.
      - name: created_at
        description: Timestamp the prospect pool was created.
      - name: updated_at
        description: Timestamp the prospect pool was last updated.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__prospect_pool_stage
    description: Table capturing stages prospects in different pools advance through.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: prospect_stage_id
        description: Unique identifier for the prospect stage.
      - name: prospect_stage_name
        description: Name of the stage as it appears inside the prospect pool.
      - name: prospect_pool_id
        description: Id of the prospect pool this stage belongs to.
      - name: sort_order
        description: Position of this stage within its prospect pool, ascending. Lower values appear first in the Greenhouse UI.
      - name: created_at
        description: Timestamp the stage was created.
      - name: updated_at
        description: Timestamp the stage was last updated.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__rejection_reason
    description: Table storing the organization's candidate rejection reason definitions.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: rejection_reason_id
        description: Unique identifier for the rejection reason.
        tests:
          - not_null
      - name: name
        description: Display label shown to recruiters when rejecting a candidate (e.g. Not a cultural fit, Lacking skill(s)/qualification(s)). Unique within the organization.
      - name: type_id
        description: Id of the rejection reason type this reason rolls up to. Stable across all reasons sharing the same categorization.
      - name: type_key
        description: Stable machine-readable identifier for the reason type. One of WE_REJECTED_THEM, THEY_REJECTED_US, NONE_SPECIFIED, or SECURITY_CONCERN.
      - name: type_name
        description: Display name of the rejection reason type used in Greenhouse reporting. One of We rejected them, They rejected us, None specified, or Security concern.
      - name: created_at
        description: Timestamp the rejection reason was created.
      - name: updated_at
        description: Timestamp the rejection reason was last updated.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"

  - name: stg_greenhouse__candidate_tag
    description: Table storing candidate tag definitions.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: tag_id
        description: Unique identifier for the tag.
        tests:
          - not_null
      - name: tag_name
        description: Display label for the tag as it appears on candidate profiles. Unique per organization, case sensitive.
      - name: created_at
        description: Timestamp the tag was created.
      - name: updated_at
        description: Timestamp the tag was last updated.
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"
