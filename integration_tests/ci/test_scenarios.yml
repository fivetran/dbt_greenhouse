schema_variable_name: "greenhouse_schema"

include_databricks_sql: false
include_sqlserver: false
include_dbt_compile: true

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: false

  - name: "optional features disabled"
    vars:
      greenhouse_using_app_history: false
      greenhouse_using_job_department: false
      greenhouse_using_job_office: false
      greenhouse_using_eeoc: false
      greenhouse_using_prospects: false
      greenhouse_using_job_hiring_team: false
      greenhouse_using_job_post_location: false
    include_incremental: false

  - name: "MDLS"
    vars:
      fivetran_using_source_casing: true
    include_incremental: false
    include_dbt_seed: true
