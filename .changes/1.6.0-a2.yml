version: 1.6.0-a2
pr_number: 50
is_breaking: false

schema_data_changes:
  entries:
    - models:
        - greenhouse__application_history
      change_type: Schema change
      old: "Sourced from `APPLICATION_HISTORY`: `new_stage_id`, `new_status`, `valid_from`/`valid_until` derived from `updated_at`"
      new: "Sourced from `APPLICATION_STAGE`: `job_interview_stage_id`, `is_current`, `valid_from`/`valid_until` derived from `entered_at`/`exited_at`"
      is_breaking: true
      notes: Customer reported `stg_greenhouse__application_history` no longer reliably provides one row per stage per application. Re-sourcing from `stg_greenhouse__application_stage` restores that grain.
    - models:
        - greenhouse__job_enhanced
        - stg_greenhouse__office
      change_type: Bug fix
      old: "`location`, `primary_in_house_contact_user_id`"
      new: "`location_name`, `primary_contact_user_id`"
      is_breaking: true
      notes: Restores `office_locations` data after making sure the proper V3 source names were referenced.
    - models:
        - stg_greenhouse__application_stage
        - stg_greenhouse__application_stage_tmp
      change_type: New staging models
      is_breaking: false
      notes: Adds `APPLICATION_STAGE` table introduced in the Harvest V3 API to properly enrich `greenhouse__application_history`. Adds the `greenhouse_using_application_stage` variable to enable/disable this source. See the [README](https://github.com/fivetran/dbt_greenhouse/blob/main/README.md#disable-models-for-non-existent-sources) for more details.
