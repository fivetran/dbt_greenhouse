version: 1.6.0-a3
pr_number: 51
is_breaking: false

schema_data_changes:
  entries:
    - models:
        - greenhouse__application_enhanced
      change_type: Columns added
      new: "`prospect_pool_id`, `prospect_pool_stage_id`, `prospect_owner_id`, `prospect_owner_name`"
      is_breaking: false
      notes: Restores prospect pipeline data removed as a breaking change in v1.5.0 — lets customers who use Greenhouse's CRM/sourcing pool features see which pool and stage a candidate sits in again.
    - models:
        - greenhouse__interview_scorecard_detail
      change_type: Columns added
      new: "`attribute_name`, `sort_order`"
      is_breaking: false
      notes: Resolves the `job_candidate_attribute_id` FK, which previously had no attribute name or display order — labels scorecard ratings by the actual trait being evaluated (e.g. "JavaScript", "Leadership") instead of a bare ID.
    - models:
        - greenhouse__interview_scorecard_detail
      change_type: Columns added
      new: "`scorecard_question_answers`"
      is_breaking: false
      notes: Surfaces the scorecard questions asked and the interviewer's responses, not just a rating — useful for understanding what was asked and how an interviewer actually responded. One concatenated value per scorecard (not a separate row per question) to avoid duplicating attribute-rating rows, since questions and rated attributes are independent lists with no shared key.
    - models:
        - greenhouse__interview_enhanced
      change_type: Columns added
      new: "`interview_duration_minutes`, `requires_scorecard`, `scheduling_type`, `anonymize_candidate`, `anonymize_resumes`, `exercises`"
      is_breaking: false
      notes: "`exercises` replaces `interview_kit_content`, which was removed in v1.5.0. The remaining fields support interview-process compliance/consistency reporting."
    - models:
        - greenhouse__application_enhanced
      change_type: Columns added
      new: "`rejection_reason_id`, `rejection_reason_name`, `rejection_reason_type_name`, `rejected_by_id`"
      is_breaking: false
      notes: Surfaces why and by whom an application was rejected.
    - models:
        - greenhouse__application_history
      change_type: Variable change
      old: Controlled by `greenhouse_using_app_history`
      new: Controlled by `greenhouse_using_application_stage`
      is_breaking: true
      notes: "The model is now sourced from `stg_greenhouse__application_stage`, so it follows that model's variable. If you set `greenhouse_using_app_history: false`, the model no longer disables. It builds whenever `greenhouse_using_application_stage` is `true` (the default), and fails if `APPLICATION_STAGE` is not synced. To disable the model, set `greenhouse_using_application_stage: false`. See the [README](https://github.com/fivetran/dbt_greenhouse/blob/main/README.md#disable-models-for-non-existent-sources) for more details."
    - models:
        - stg_greenhouse__note
      change_type: Changed staging model, columns added
      old: "`stg_greenhouse__activity`, sourced from `ACTIVITY`"
      new: "`stg_greenhouse__note`, sourced from `NOTE`.<br> Adds `application_id`, `body_with_tags`, `email_attachment_file_names`, `email_from`, `email_to`, `email_cc`, `import_hash`, `type`, `updated_at`, `visibility`"
      is_breaking: true
      notes: "`NOTE` merges the v2 `ACTIVITY`/`EMAIL`/`EMAIL_CC` tables, distinguished by a `type` column, so the model now returns more rows (emails and other note types) than `stg_greenhouse__activity` did."
    - models:
        - stg_greenhouse__prospect_detail
        - stg_greenhouse__job_candidate_attribute
        - stg_greenhouse__scorecard_question
        - stg_greenhouse__scorecard_question_answer
        - stg_greenhouse__job_interview
        - stg_greenhouse__interview_kit
        - stg_greenhouse__rejection_reason
        - stg_greenhouse__rejection_detail
      change_type: New staging models
      is_breaking: false
      notes: Adds new staging models over the corresponding new Harvest V3 tables. Each is backed by a `greenhouse_using_*` variable (default `true`) to disable it if the underlying table isn't synced. These variables are enabled dynamically in Quickstart based on which tables you sync. See the [README](https://github.com/fivetran/dbt_greenhouse/blob/main/README.md#disable-models-for-non-existent-sources) for the full list and how to configure them.

bug_fixes:
  - description: Fixes `job_stage` and `interview_name` returning `null` for most interviews in `greenhouse__interview_enhanced` and `greenhouse__interview_scorecard_detail`, by correctly resolving a scheduled interview's stage through the new `JOB_INTERVIEW` table.
  - description: Fixes `scorecard_id`, `candidate_rating`, `scorecard_submitted_at`, and `interviewer_name` returning `null` for ad-hoc scorecards in `greenhouse__interview_scorecard_detail` — these scorecards exist on `SCORECARD` but have no matching row on the `INTERVIEWER` bridge table, so they previously dropped out of the join entirely. They now surface as additional rows keyed on `application_id`, with no interview association guessed at.
  - description: Fixes duplicate rows in `greenhouse__application_enhanced`, `greenhouse__application_history`, and `greenhouse__job_enhanced` for applications with more than one `EEOC` submission (e.g. a candidate updates their self-identification responses). `int_greenhouse__application_info` now keeps only the most recent `EEOC` record per application instead of joining to all of them.
